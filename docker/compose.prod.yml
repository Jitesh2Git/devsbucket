# Production (Phase 6, decision 0020): the whole app on one VM. On the
# server this file is /opt/devsbucket/compose.yml, next to the Caddyfile
# and .env (from docker/.env.prod.example). Images come from GHCR, tagged
# with the commit they were built from (DEVSBUCKET_TAG).
# On the Mac, the same stack runs with Garage and locally built images:
# docker/compose.prodlike.yml (`pnpm prodlike …`).
name: devsbucket-prod

# Every container's logs rotate (5 × 10 MB each) instead of filling the disk.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

# What the three apps share: the database and the bucket.
x-database-url: &database-url postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
x-storage: &storage
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_REGION: ${S3_REGION:?}
  S3_BUCKET: ${S3_BUCKET:?}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    # Not published: only the other containers reach it.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2g
    logging: *logging

  web:
    image: ghcr.io/jitesh2git/devsbucket-web:${DEVSBUCKET_TAG:?}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *storage
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: https://${DEVSBUCKET_DOMAIN:?}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g
    logging: *logging

  realtime:
    image: ghcr.io/jitesh2git/devsbucket-realtime:${DEVSBUCKET_TAG:?}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *storage
      DATABASE_URL: *database-url
      # Browsers' Origin must be the public address; sessions are checked
      # with the web container directly.
      WEB_URL: https://${DEVSBUCKET_DOMAIN:?}
      WEB_INTERNAL_URL: http://web:3000
      PORT: 3001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # A file open in the live editor takes ~6× its size in memory here
    # (100 MB → ~630 MB). Tuned in step 7.
    deploy:
      resources:
        limits:
          memory: 3g
    logging: *logging

  # The scheduled jobs and notifications. Also runs the commands done by
  # hand in prod, each in a one-off container:
  #   docker compose run --rm worker node src/migrate.ts
  #   docker compose run --rm worker node src/admin.ts <command>
  #   docker compose run --rm worker node src/run-job.ts <job>
  #   docker compose run --rm -e S3_CORS_ORIGINS=https://<domain> worker node ../../packages/storage/src/setup.ts
  worker:
    image: ghcr.io/jitesh2git/devsbucket-worker:${DEVSBUCKET_TAG:?}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *storage
      DATABASE_URL: *database-url
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      - web
      - realtime
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DEVSBUCKET_DOMAIN: ${DEVSBUCKET_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and their keys: kept, or Let's Encrypt would be asked
      # again on every restart (and rate-limits that).
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
