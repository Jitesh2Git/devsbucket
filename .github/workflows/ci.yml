# Runs on every pull request and on every push to main. Branch protection on
# main requires the "checks" job to pass before a PR can be merged. After the
# checks, "images" builds the three Docker images (Phase 6): on a PR only to
# prove they still build, on main also pushed to GHCR for the server.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token by default; only the images job may write (to GHCR).
permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    # e2e alone takes ~14 minutes here; room for a retry and a slow runner.
    timeout-minutes: 30

    # A throwaway Postgres for the end-to-end tests (same image as local).
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: devsbucket
          POSTGRES_PASSWORD: devsbucket
          POSTGRES_DB: devsbucket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsbucket -d devsbucket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only values for a database that's deleted when the job ends. They
    # are not secrets: nothing real uses them. GitHub login isn't exercised.
    env:
      DATABASE_URL: postgres://devsbucket:devsbucket@localhost:5432/devsbucket
      BETTER_AUTH_SECRET: ci-only-secret-for-a-throwaway-database-0001
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ci-unused
      GITHUB_CLIENT_SECRET: ci-unused
      # Garage, started below. Throwaway values like the ones above.
      GARAGE_RPC_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      S3_ENDPOINT: http://127.0.0.1:3900
      S3_REGION: garage
      S3_BUCKET: devsbucket
      S3_ACCESS_KEY_ID: GK0123456789abcdef01234567
      S3_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      S3_CORS_ORIGINS: http://localhost:3100
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      # Garage (S3) for the upload tests, same image and config as local. A
      # step rather than a service: its config file comes from the repo,
      # which services can't mount (they start before checkout).
      - name: Start Garage
        run: |
          docker run -d --name garage -p 127.0.0.1:3900:3900 \
            -v "$PWD/docker/garage/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_RPC_SECRET -e GARAGE_DEFAULT_ACCESS_KEY="$S3_ACCESS_KEY_ID" \
            -e GARAGE_DEFAULT_SECRET_KEY="$S3_SECRET_ACCESS_KEY" -e GARAGE_DEFAULT_BUCKET="$S3_BUCKET" \
            dxflrs/garage:v2.5.0 /garage server --single-node --default-bucket
          timeout 60 sh -c 'until docker exec garage /garage status > /dev/null 2>&1; do sleep 1; done'

      # Installs pnpm (version from packageManager in package.json) and Node
      # (version from .nvmrc), then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Tests that need Postgres (packages/db, *.db.test.ts). They create and
      # migrate devsbucket_test next to the database above, and roll back
      # their own rows.
      - name: Database tests
        run: pnpm test:db

      # The dev bucket and the e2e tests' own "<bucket>-test" bucket.
      - name: Set up the buckets (CORS, test bucket)
        run: pnpm storage:setup && pnpm storage:setup-test

      - name: Install Playwright's Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      # Keep Playwright's traces (step-by-step recordings) for a week whenever
      # a test failed, even if its retry passed (a flaky test) or the job was
      # cancelled: download them from the run page and open with show-trace.
      # Playwright only keeps traces of failed attempts, so a clean run
      # uploads nothing.
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The images the server runs (docker/*.Dockerfile, Phase 6, decision 0020),
  # built on GitHub's free Arm runner for the arm64 VM. On main they're pushed
  # to GHCR tagged with the commit SHA (what a deploy runs and a rollback
  # goes back to) and "main" (the newest). The three packages are public, so
  # the server pulls them without logging in.
  images:
    name: Image (${{ matrix.app }})
    needs: checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: docker/web.Dockerfile
          - app: realtime
            dockerfile: docker/node.Dockerfile
          - app: worker
            dockerfile: docker/node.Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The layer cache lives in GitHub Actions' cache, one scope per image,
      # so an unchanged dependency install isn't redone. APP is read by
      # node.Dockerfile, NEXT_PUBLIC_REALTIME_URL (a repository variable,
      # public anyway: it's in the page) by web.Dockerfile.
      - name: Build (and push, on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_REALTIME_URL=${{ vars.NEXT_PUBLIC_REALTIME_URL }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/jitesh2git/devsbucket-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/jitesh2git/devsbucket-${{ matrix.app }}:main
          push: ${{ env.PUSH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
